; Elecrow DLE06235B 3.5-inch ESP32-S3 voice assistant
;

[platformio]
default_envs = elecrow-esp32-s3

[env:elecrow-esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Registry-backed dependencies pinned to the versions recorded in context.md.
; Numeric PlatformIO registry IDs are used where the Arduino library name differs
; from the PlatformIO registry package name.
lib_deps =
    1559@2.5.43
    bblanchon/ArduinoJson@7.4.1

; Local/bundled dependencies from context.md that are intentionally not declared
; as registry packages. ST77922 is copied into lib/ST77922 for this project.
; - ST77922_TOUCH (custom local library; no library.properties)
; - audio-driver 0.1.2 (bundled as arduino-audio-driver-main; registry package not confirmed)
; - audio-tools 1.1.0 (bundled as arduino-audio-tools-main; registry package not confirmed)
; - ESP32Time, HttpClient, Time, and TJpg_Decoder are bundled locally; registry
;   package/version mapping was not confirmed from the supplied context.

monitor_speed = 115200
upload_speed = 115200

; Keep generated files out of source control.
monitor_filters = esp32_exception_decoder
